name: Cron Scraper

# Runs the scholarship discovery/scraping pipeline by POSTing to the secured
# /api/cron/trigger endpoint on the deployed server.
#
# Schedule: every 2 days at 00:00 IST (18:30 UTC).
# Requires the CRON_SECRET repository secret (must match the server's env).
# Optionally set the API_BASE_URL repository variable to point at a different host.

on:
  schedule:
    - cron: "30 18 */2 * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scholarship scraper
        env:
          API_URL: ${{ vars.API_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          URL="${API_URL:-https://atlasfunding.onrender.com}"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            "${URL}/api/cron/trigger?job=scraper"
